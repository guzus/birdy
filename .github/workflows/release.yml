name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.4.0)"
        required: true
        default: "v0.4.0"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # For workflow_dispatch we release the requested tag; for push tags we use the tag that triggered the workflow.
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

      - name: Set Up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./... -count=1

      - name: Generate Release Notes
        run: ./scripts/release_notes.sh "${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}" > /tmp/birdy-release-notes.md

      - name: GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          # Homebrew publishing needs a PAT that can write to guzus/homebrew-tap;
          # GITHUB_TOKEN is scoped to this repository only. When the secret is
          # absent the formula step is skipped so the release still succeeds
          # rather than failing at the last step.
          args: >-
            release --clean --release-notes=/tmp/birdy-release-notes.md
            ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN == '' && '--skip=homebrew' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
