name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets CI be started by hand against any ref, which is the only lever left
  # when GitHub stops dispatching push/pull_request events for the repo:
  #   gh workflow run ci.yml --ref <branch>
  # It also makes stacked PRs testable — their base is not main, so the
  # pull_request trigger above never matches them.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2b-runner/package-lock.json

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23

      - name: Install Bird Box runner dependencies
        run: npm ci --prefix e2b-runner --omit=dev --ignore-scripts

      - name: Build
        run: go build ./...

      - name: Verify Go, Bird Box, and Birdy Web
        run: make verify
