# Example: Using birdy in GitHub Actions
#
# Store your accounts JSON as a repository secret named BIRDY_ACCOUNTS:
#   [{"name":"bot1","auth_token":"xxx","ct0":"yyy"}]
#
# Then reference it as shown below.

name: birdy example

on:
  workflow_dispatch:

jobs:
  tweet:
    runs-on: ubuntu-latest
    steps:
      - name: Set Up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install birdy
        run: |
          curl -fsSL https://raw.githubusercontent.com/guzus/birdy/main/install.sh | bash

      - name: Read a tweet
        env:
          BIRDY_ACCOUNTS: ${{ secrets.BIRDY_ACCOUNTS }}
        run: birdy -v read 1234567890

      - name: Post a tweet
        env:
          BIRDY_ACCOUNTS: ${{ secrets.BIRDY_ACCOUNTS }}
        run: birdy -v tweet "Hello from CI!"
