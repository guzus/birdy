version: 2

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/guzus/birdy/cmd.version={{.Version}}
      - -X github.com/guzus/birdy/cmd.commit={{.Commit}}
      - -X github.com/guzus/birdy/cmd.date={{.Date}}

archives:
  # The archive is the birdy binary and nothing else. It used to carry the
  # vendored bird CLI and its node_modules, which made a Go binary's release
  # depend on a Node runtime being present to be useful. Every command birdy
  # serves is native now, so the bundle bought nothing but weight.
  #
  # --bird still works: it resolves bird from BIRDY_BIRD_PATH or PATH, so a
  # maintainer who wants to diff the two engines installs bird separately.
  # That is deliberate — see docs/MIGRATION.md on why the escape hatch outlives
  # the migration.
  - format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip

brews:
  - repository:
      owner: guzus
      name: homebrew-tap
    homepage: "https://github.com/guzus/birdy"
    description: "Multi-account proxy for the bird CLI to reduce rate-limit risk"
    license: "MIT"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
