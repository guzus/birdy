version: 2

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/guzus/birdy/cmd.version={{.Version}}
      - -X github.com/guzus/birdy/cmd.commit={{.Commit}}
      - -X github.com/guzus/birdy/cmd.date={{.Date}}

archives:
  # The archive is the birdy binary and nothing else. It used to carry the
  # vendored bird CLI and its node_modules, which made a Go binary's release
  # depend on a Node runtime being present to be useful. Every command birdy
  # serves is native now, so the bundle bought nothing but weight.
  #
  # --bird still works: it resolves bird from BIRDY_BIRD_PATH or PATH, so a
  # maintainer who wants to diff the two engines installs bird separately.
  # That is deliberate — see docs/MIGRATION.md on why the escape hatch outlives
  # the migration.
  - format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip

brews:
  - repository:
      owner: guzus
      name: homebrew-tap
      # Pushing a formula into another repository needs a token that can write
      # to it; the workflow's default GITHUB_TOKEN is scoped to this one.
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/guzus/birdy"
    description: "Multi-account X/Twitter CLI with account rotation, in one Go binary"
    license: "MIT"
    # The formula installs a single binary — there is no Node runtime and no
    # bundled bird to depend on.
    install: |
      bin.install "birdy"
    test: |
      assert_match "birdy", shell_output("#{bin}/birdy version")

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
