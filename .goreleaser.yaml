version: 2

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/guzus/birdy/cmd.version={{.Version}}
      - -X github.com/guzus/birdy/cmd.commit={{.Commit}}
      - -X github.com/guzus/birdy/cmd.date={{.Date}}

archives:
  - format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    files:
      # `*` matches top-level files (package.json, README.md, LICENSE,
      # CHANGELOG.md) directly, and goreleaser/fileglob recursively expands
      # any matching directories (dist/, node_modules/) via fs.WalkDir, so a
      # single pattern covers everything. The previous `**/*` skipped
      # top-level files, leaving package.json out and breaking the bird CLI
      # with "Cannot use import statement outside a module" because Node
      # could not see `"type": "module"`.
      - src: "third_party/@steipete/bird/*"
        dst: "bird"
    format_overrides:
      - goos: windows
        format: zip

brews:
  - repository:
      owner: guzus
      name: homebrew-tap
    homepage: "https://github.com/guzus/birdy"
    description: "Multi-account proxy for the bird CLI to reduce rate-limit risk"
    license: "MIT"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
