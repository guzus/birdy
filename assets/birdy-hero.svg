<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img">
  <title>Birdy — Read X faster than light</title>
  <desc>Birdy is a lightweight multi-account X/Twitter CLI, installable with
  brew install birdy.</desc>

  <rect width="1280" height="640" fill="#F2FAFE"/>

  <text x="96" y="230" font-family="Helvetica, Arial, sans-serif" font-size="132"
        font-weight="700" fill="#0B1220" letter-spacing="-2">Birdy</text>

  <text x="96" y="310" font-family="Helvetica, Arial, sans-serif" font-size="42"
        font-weight="500" fill="#0B1220">Read X faster than light</text>

  <!-- Terminal chip, same language as the other social assets. -->
  <rect x="96" y="392" width="520" height="86" rx="14" fill="#252D3F"/>
  <text x="128" y="447" font-family="Menlo, Monaco, monospace" font-size="30" fill="#2CAADD">$</text>
  <text x="164" y="447" font-family="Menlo, Monaco, monospace" font-size="30" fill="#E8EEF6">brew install birdy</text>

  <!-- The bird, from assets/birdy-logo.svg. Same paths, same #2CAADD. -->
  <g transform="translate(846 148) scale(1.14)">
    <path fill="#2CAADD" fill-rule="evenodd"
      d="M20 111c22-3 41-11 50-21 14-14 29-10 45 4 21 18 46 24 72 18 50-12 96-52 131-90 4-4 7-2 7 4 2 24-8 44-29 62-30 23-52 49-61 86-4 19-11 32-25 40-26 13-57 15-84 5-35-13-57-37-68-65-10-24-22-36-38-43ZM90 94a9 12 0 1 0 0 24 9 12 0 1 0 0-24Z"/>
    <g fill="none" stroke="#2CAADD" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M177 218l13 49h22"/>
      <path d="M214 197l17 87h20"/>
      <path d="M191 267c-14 3-22 15-24 31"/>
      <path d="M194 269c-10 8-15 20-16 33"/>
      <path d="M198 271c-7 10-9 23-7 36"/>
      <path d="M232 284c-14 4-22 18-25 37"/>
      <path d="M237 285c-10 10-14 25-14 40"/>
      <path d="M242 286c-7 13-9 28-7 43"/>
    </g>
  </g>
</svg>
